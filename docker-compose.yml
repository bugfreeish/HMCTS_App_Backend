services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: hmcts
      POSTGRES_PASSWORD: hmcts
      POSTGRES_DB: hmcts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh

volumes:
  pgdata:
